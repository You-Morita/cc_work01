<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPB 2025 観客動員ダッシュボード</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#07090f;--surface:#0e1117;--surface2:#141820;--surface3:#1b2030;
  --border:#1f2535;--border2:#273045;
  --txt:#e8eaf0;--txt2:#8b93a8;--txt3:#535e75;
  --accent:#6c8cff;--accent2:#4a6cf7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter','Meiryo','Yu Gothic',sans-serif;background:var(--bg);color:var(--txt);height:100%;display:flex;flex-direction:column;font-size:14px}

/* ── TOP NAV ── */
.topnav{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;z-index:10}
.topnav .logo{font-size:1rem;font-weight:700;color:#fff;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px}
.topnav .logo-icon{width:28px;height:28px;background:linear-gradient(135deg,var(--accent2),#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.topnav .subtitle{font-size:0.72rem;color:var(--txt3);margin-left:4px}
.topnav .spacer{flex:1}
.topnav .tag{font-size:0.7rem;color:var(--txt3);background:var(--surface3);border:1px solid var(--border);border-radius:20px;padding:3px 10px}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:200px;min-width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.league-section{padding:12px 0 4px}
.league-label{font-size:0.62rem;font-weight:600;letter-spacing:0.1em;color:var(--txt3);padding:0 14px 6px;text-transform:uppercase}
.team-btn{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;border:none;background:none;color:var(--txt2);font-size:0.8rem;font-family:inherit;text-align:left;width:100%;transition:all 0.12s;position:relative}
.team-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;border-radius:0 2px 2px 0;transition:background 0.12s}
.team-btn:hover{background:var(--surface3);color:var(--txt)}
.team-btn.active{background:var(--surface3);color:#fff}
.team-btn.active::before{background:var(--accent)}
.team-icon{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:800;flex-shrink:0}
.team-name-label{font-size:0.78rem}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;background:var(--bg);padding:0}
.main-inner{padding:20px 24px;display:flex;flex-direction:column;gap:18px;min-width:900px}

/* ── WELCOME ── */
.welcome{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;color:var(--txt3)}
.welcome .icon{font-size:3rem;opacity:0.3}
.welcome p{font-size:0.9rem}

/* ── TEAM HERO ── */
.hero{border-radius:16px;padding:24px 28px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden;border:1px solid var(--border2)}
.hero::before{content:'';position:absolute;inset:0;opacity:0.07;background:radial-gradient(circle at 80% 50%,#fff 0%,transparent 60%)}
.hero .hero-badge{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;flex-shrink:0;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.hero .hero-info h2{font-size:1.25rem;font-weight:700;color:#fff;letter-spacing:-0.02em}
.hero .hero-info .hero-sub{font-size:0.75rem;color:rgba(255,255,255,0.55);margin-top:4px}
.hero .chips{display:flex;gap:8px;margin-left:auto}
.hero .chip{background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:8px 16px;text-align:center;flex-shrink:0}
.hero .chip .chip-label{font-size:0.65rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.06em}
.hero .chip .chip-val{font-size:1rem;font-weight:700;color:#fff;margin-top:2px}

/* ── KPI ROW ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;transition:border-color 0.2s}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.kpi .kpi-label{font-size:0.68rem;font-weight:500;color:var(--txt3);text-transform:uppercase;letter-spacing:0.07em}
.kpi .kpi-val{font-size:1.7rem;font-weight:700;color:#fff;margin-top:6px;letter-spacing:-0.03em;line-height:1}
.kpi .kpi-sub{font-size:0.7rem;color:var(--txt3);margin-top:5px}
.kpi .kpi-bar{height:3px;background:var(--surface3);border-radius:2px;margin-top:10px;overflow:hidden}
.kpi .kpi-bar-fill{height:3px;border-radius:2px;transition:width 0.5s ease}

/* ── CARDS ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.card-title{font-size:0.72rem;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.card-title .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ch{position:relative}
.ch.h180{height:180px}.ch.h220{height:220px}.ch.h260{height:260px}.ch.h300{height:300px}

/* ── RANK TABLE ── */
.rank-table{width:100%;border-collapse:collapse}
.rank-table th{font-size:0.65rem;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:0.07em;padding:0 8px 8px;text-align:left;border-bottom:1px solid var(--border)}
.rank-table td{padding:8px 8px;border-bottom:1px solid var(--border);font-size:0.78rem;color:var(--txt2);vertical-align:middle}
.rank-table tr:last-child td{border-bottom:none}
.rank-table tr:hover td{background:var(--surface3);color:var(--txt)}
.mini-bar-bg{height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;width:80px}
.mini-bar-fg{height:5px;border-radius:3px}
.rank-num{font-size:0.7rem;color:var(--txt3);width:20px;text-align:right}
.rank-name{flex:1}
.rank-val{font-size:0.78rem;color:var(--txt);font-weight:500;text-align:right;white-space:nowrap}

/* ── LEAGUE RANK ── */
.lrank-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:0.78rem}
.lrank-row:last-child{border-bottom:none}
.lrank-row.me .lrank-name,.lrank-row.me .lrank-val{color:#fff;font-weight:600}
.lrank-row.me .lrank-pos{color:var(--accent)}
.lrank-pos{width:18px;text-align:right;font-size:0.7rem;color:var(--txt3);font-weight:600}
.lrank-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lrank-name{flex:1;color:var(--txt2)}
.lrank-bar{flex:2;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.lrank-bar-fill{height:4px;border-radius:2px}
.lrank-val{width:72px;text-align:right;color:var(--txt2);font-size:0.75rem}
</style>
</head>

const TEAM_META = {
  '福岡ソフトバンクホークス':      {bg:'#F5A623',fg:'#000',short:'SBH',  name:'ソフトバンク', league:'pl'},

  '読売ジャイアンツ':               {bg:'#F26522',fg:'#fff',short:'G',    name:'巨人',         league:'cl'},

  '中日ドラゴンズ':                 {bg:'#0057A8',fg:'#fff',short:'D',    name:'中日',         league:'cl'},
};

const SHORT = t => (TEAM_META[t]||{}).name || t.slice(0,4);

// 暗すぎる色（輝度 < 0.15）はグラフ用に白へ差し替え
function chartColor(hex){
  var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var lum=0.2126*r+0.7152*g+0.0722*b;
  return lum < 0.15 ? '#ffffff' : hex;
}

Chart.defaults.font.family = "Inter, Meiryo, Yu Gothic, sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.color = '#8b93a8';

var charts = {};
function destroyAll(){Object.values(charts).forEach(c=>c&&c.destroy());charts={};}

const gridOpts = (teamColor, minOffset) => ({
  x:{ticks:{color:'#535e75'},grid:{color:'#1a2030',lineWidth:1}},
  y:{ticks:{color:'#535e75',callback:v=>(v/10000).toFixed(1)+'万'},grid:{color:'#1a2030',lineWidth:1},
     min: minOffset !== undefined ? minOffset : undefined}
});

// ── Sidebar ──
function buildSidebar(){
  ['pl','cl'].forEach(league=>{
    var el = document.getElementById(league+'-list');
    DATA.all_teams.forEach(t=>{
      var m = TEAM_META[t]; if(!m||m.league!==league) return;
      var btn = document.createElement('button');
      btn.className='team-btn'; btn.dataset.team=t;
      btn.innerHTML=`<span class="team-icon" style="background:${m.bg};color:${m.fg}">${m.short}</span>`+
        `<span class="team-name-label">${m.name}</span>`;
      btn.onclick=()=>selectTeam(t);
      el.appendChild(btn);
    });
  });
}
buildSidebar();

function selectTeam(team){
  document.querySelectorAll('.team-btn').forEach(b=>b.classList.toggle('active',b.dataset.team===team));
  renderTeam(team);
}

// ── Render ──
function renderTeam(team){
  destroyAll();
  var d = DATA.team_detail[team];
  var m = TEAM_META[team]||{bg:'#6c8cff',fg:'#fff',short:'?',name:team};
  var maxLeague = Math.max(...Object.values(DATA.league_avg));
  var myAvg = DATA.league_avg[team];
  var rank = Object.entries(DATA.league_avg).sort((a,b)=>b[1]-a[1]).findIndex(e=>e[0]===team)+1;
  var pct = Math.round(myAvg/maxLeague*100);

  document.getElementById('main-inner').innerHTML = buildHTML(team,d,m,rank,pct,maxLeague,cc);

  // hero bg
  document.querySelector('.hero').style.background =
    `linear-gradient(135deg, ${m.bg}22 0%, var(--surface2) 60%)`;
  document.querySelector('.hero').style.borderColor = m.bg+'44';
  document.querySelectorAll('.kpi::after').forEach(el=>el.style.background=cc);
  document.querySelectorAll('.kpi-bar-fill').forEach(el=>el.style.background=cc);

  var cc = chartColor(m.bg); // グラフ用カラー（暗色は白に差し替え）

  // ── 月別 ──
  charts.month = new Chart(document.getElementById('cMonth'),{
    type:'line',
    data:{
      labels:Object.keys(d.by_month).map(m=>m+'月'),
      datasets:[{data:Object.values(d.by_month),borderColor:cc,backgroundColor:cc+'18',
        fill:true,tension:0.4,pointBackgroundColor:cc,pointRadius:4,pointHoverRadius:7,borderWidth:2}]
    },
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+ctx.parsed.y.toLocaleString()+' 人'}}},
      scales:gridOpts(cc)}
  });

  // ── デー/ナイター ──
  charts.dn = new Chart(document.getElementById('cDN'),{
    type:'bar',
    data:{
      labels:['デーゲーム\n'+d.day_count+'試合','ナイター\n'+d.night_count+'試合'],
      datasets:[{data:[d.day_avg,d.night_avg],
        backgroundColor:[cc+'dd',cc+'66'],borderRadius:8,barThickness:56}]
    },
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+ctx.parsed.y.toLocaleString()+' 人'}}},
      scales:gridOpts(cc, Math.max(0,Math.min(d.day_avg,d.night_avg)-6000))}
  });

  // ── 対戦相手別 ──
  var vsD = d.vs_avg;
  charts.vs = new Chart(document.getElementById('cVS'),{
    type:'bar',
    data:{
      labels:vsD.map(v=>SHORT(v[0])),
      datasets:[{data:vsD.map(v=>v[1]),
        backgroundColor:vsD.map((_,i)=>i===0?cc:cc+'55'),
        borderRadius:4}]
    },
    options:{indexAxis:'y',plugins:{legend:{display:false},
      tooltip:{callbacks:{label:ctx=>' '+ctx.parsed.x.toLocaleString()+' 人'}}},
      scales:gridOpts(cc)}
  });

  // ── 球場別 ──
  var stD = d.st_avg.slice(0,6);
  charts.st = new Chart(document.getElementById('cST'),{
    type:'bar',
    data:{
      labels:stD.map(s=>s[0]),
      datasets:[{data:stD.map(s=>s[1]),
        backgroundColor:stD.map((_,i)=>i===0?cc:cc+'55'),
        borderRadius:4}]
    },
    options:{indexAxis:'y',plugins:{legend:{display:false},
      tooltip:{callbacks:{label:ctx=>' '+ctx.parsed.x.toLocaleString()+' 人 ('+stD[ctx.dataIndex][2]+'試合)'}}},
      scales:gridOpts(cc)}
  });

  // ── 散布図 ──
  var logs = d.games_log;
  charts.scatter = new Chart(document.getElementById('cScatter'),{
    type:'scatter',
    data:{datasets:[
      {label:'ホーム',
       data:logs.filter(g=>g.is_home).map(g=>({x:g.date,y:g.att,home:g.home,away:g.away,stadium:g.stadium,dn:g.dn,result:g.result,hs:g.home_score,as:g.away_score})),
       backgroundColor:cc+'cc',pointRadius:5,pointHoverRadius:8},
      {label:'アウェイ',
       data:logs.filter(g=>!g.is_home).map(g=>({x:g.date,y:g.att,home:g.home,away:g.away,stadium:g.stadium,dn:g.dn,result:g.result,hs:g.home_score,as:g.away_score})),
       backgroundColor:'rgba(108,140,255,0.45)',pointRadius:4,pointHoverRadius:7}
    ]},
    options:{
      plugins:{legend:{labels:{color:'#8b93a8',boxWidth:10,boxHeight:10,borderRadius:3}},
        tooltip:{callbacks:{
          title:items=>items[0].raw.x,
          label:item=>{var r=item.raw;return[r.home+' vs '+r.away,r.stadium+' / '+r.dn,'観客数: '+r.y.toLocaleString()+'人',r.hs+' - '+r.as+'  ['+r.result+']'];}
        }}},
      scales:{
        x:{type:'category',ticks:{color:'#535e75',maxTicksLimit:10},grid:{color:'#1a2030'}},
        y:{ticks:{color:'#535e75',callback:v=>(v/10000).toFixed(1)+'万'},grid:{color:'#1a2030'}}
      }
    }
  });
}

function buildHTML(team, d, m, rank, pct, maxLeague, cc){
  var sortedByAvg = Object.entries(DATA.league_avg).sort((a,b)=>b[1]-a[1]);
  var lrankRows = DATA.all_teams.map(t=>{
    var avgVal = DATA.league_avg[t]||0;
    var rankPos = sortedByAvg.findIndex(e=>e[0]===t)+1;
    var isMe = t===team;
    var tm = TEAM_META[t]||{bg:'#6c8cff'};
    var bp = Math.round(avgVal/maxLeague*100);
    return `<div class="lrank-row${isMe?' me':''}">
      <div class="lrank-pos">${rankPos}</div>
      <div class="lrank-dot" style="background:${tm.bg}"></div>
      <div class="lrank-name">${SHORT(t)}</div>
      <div class="lrank-bar"><div class="lrank-bar-fill" style="width:${bp}%;background:${isMe?cc:'#2a3a54'}"></div></div>
      <div class="lrank-val">${(avgVal/10000).toFixed(2)}万</div>
    </div>`;
  }).join('');

  var vsRows = d.vs_avg.map(v=>{
    var bp = Math.round(v[1]/(d.vs_avg[0][1]||1)*100);
    return `<tr>
      <td>${SHORT(v[0])}</td>
      <td style="color:#e8eaf0;font-weight:500">${v[1].toLocaleString()}人</td>
      <td style="color:var(--txt3)">${v[2]}試合</td>
      <td><div class="mini-bar-bg"><div class="mini-bar-fg" style="width:${bp}%;background:${cc}88"></div></div></td>
    </tr>`;
  }).join('');

  return `
<div class="hero">
  <div class="hero-badge" style="background:${m.bg};color:${m.fg}">${m.short}</div>
  <div class="hero-info">
    <h2>${team}</h2>
    <div class="hero-sub">2025 シーズン &nbsp;·&nbsp; ホーム平均観客数 リーグ ${rank} 位</div>
  </div>
  <div class="chips">
    <div class="chip"><div class="chip-label">勝敗</div><div class="chip-val">${d.wins}勝 ${d.losses}敗 ${d.draws}分</div></div>
    <div class="chip"><div class="chip-label">勝率</div><div class="chip-val">${d.win_rate}</div></div>
  </div>
</div>

<div class="kpi-row">
  <div class="kpi">
    <div class="kpi-label">ホーム平均観客数</div>
    <div class="kpi-val">${(d.home_avg/10000).toFixed(2)}<span style="font-size:0.9rem;font-weight:400;color:var(--txt2)">万人</span></div>
    <div class="kpi-sub">リーグ ${rank} 位 · ${d.home_games} 試合</div>
    <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="kpi">
    <div class="kpi-label">ホーム累計動員数</div>
    <div class="kpi-val">${(d.home_total/10000).toFixed(0)}<span style="font-size:0.9rem;font-weight:400;color:var(--txt2)">万人</span></div>
    <div class="kpi-sub">ホーム ${d.home_games} 試合合計</div>
  </div>
  <div class="kpi">
    <div class="kpi-label">アウェイ平均観客数</div>
    <div class="kpi-val">${(d.away_avg/10000).toFixed(2)}<span style="font-size:0.9rem;font-weight:400;color:var(--txt2)">万人</span></div>
    <div class="kpi-sub">アウェイ ${d.away_games} 試合</div>
  </div>
  <div class="kpi">
    <div class="kpi-label">デー / ナイター 平均</div>
    <div class="kpi-val" style="font-size:1.2rem">${(d.day_avg/10000).toFixed(2)} <span style="color:var(--txt3);font-size:0.85rem">/</span> ${(d.night_avg/10000).toFixed(2)}<span style="font-size:0.8rem;font-weight:400;color:var(--txt2)">万</span></div>
    <div class="kpi-sub">デー ${d.day_count} 試合 / ナイター ${d.night_count} 試合</div>
  </div>
</div>

<div class="grid2">
  <div class="card">
    <div class="card-title"><span class="dot"></span>月別 ホーム平均観客数</div>
    <div class="ch h220"><canvas id="cMonth"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title"><span class="dot"></span>デーゲーム vs ナイター（ホーム）</div>
    <div class="ch h220"><canvas id="cDN"></canvas></div>
  </div>
</div>

<div class="grid2">
  <div class="card">
    <div class="card-title"><span class="dot"></span>対戦相手別 ホーム平均観客数</div>
    <div class="ch h260"><canvas id="cVS"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title"><span class="dot"></span>球場別 平均観客数（ホーム）</div>
    <div class="ch h260"><canvas id="cST"></canvas></div>
  </div>
</div>

<div class="grid2">
  <div class="card">
    <div class="card-title"><span class="dot"></span>リーグ 観客動員ランキング</div>
    ${lrankRows}
  </div>
  <div class="card">
    <div class="card-title"><span class="dot"></span>対戦相手別 詳細（ホーム）</div>
    <table class="rank-table">
      <thead><tr><th>相手</th><th>平均観客数</th><th>試合数</th><th></th></tr></thead>
      <tbody>${vsRows}</tbody>
    </table>
  </div>
</div>

<div class="card">
  <div class="card-title"><span class="dot"></span>全試合 観客数推移 &nbsp;<span style="color:var(--txt3);font-weight:400;font-size:0.68rem">ホーム = チームカラー &nbsp;·&nbsp; アウェイ = 青</span></div>
  <div class="ch h300"><canvas id="cScatter"></canvas></div>
</div>
`;
}
</script>
</body>
</html>
