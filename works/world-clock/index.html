<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Clock</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --text: #e0e0f0;
    --muted: #666688;
    --accent: #7c6af7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 24px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }

  header .local-time {
    margin-top: 12px;
    font-size: 3.2rem;
    font-weight: 200;
    letter-spacing: 0.05em;
    line-height: 1;
  }

  header .local-date {
    margin-top: 6px;
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    gap: 16px;
    align-items: center;
    transition: border-color 0.3s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }

  .card.day::before {
    background: radial-gradient(ellipse at top right, rgba(255,200,80,0.06), transparent 60%);
    opacity: 1;
  }

  .card.night::before {
    background: radial-gradient(ellipse at top right, rgba(100,80,200,0.08), transparent 60%);
    opacity: 1;
  }

  .card:hover {
    border-color: var(--accent);
  }

  /* Analog clock */
  .analog {
    flex-shrink: 0;
    position: relative;
    width: 64px;
    height: 64px;
  }

  .analog svg {
    width: 100%;
    height: 100%;
  }

  .clock-face {
    fill: none;
    stroke: var(--border);
    stroke-width: 1.5;
  }

  .tick {
    stroke: var(--muted);
    stroke-width: 1;
    opacity: 0.4;
  }

  .hand-hour {
    stroke: var(--text);
    stroke-width: 2.5;
    stroke-linecap: round;
    transform-origin: 32px 32px;
    transition: transform 0.5s cubic-bezier(0.4,2.08,0.55,0.44);
  }

  .hand-minute {
    stroke: var(--text);
    stroke-width: 1.8;
    stroke-linecap: round;
    transform-origin: 32px 32px;
    transition: transform 0.5s cubic-bezier(0.4,2.08,0.55,0.44);
  }

  .hand-second {
    stroke: var(--accent);
    stroke-width: 1.2;
    stroke-linecap: round;
    transform-origin: 32px 32px;
    /* no transition — smooth requestAnimationFrame */
  }

  .center-dot {
    fill: var(--accent);
  }

  /* Digital info */
  .info {
    flex: 1;
    min-width: 0;
  }

  .city-name {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .country {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .digital-time {
    font-size: 1.6rem;
    font-weight: 200;
    letter-spacing: 0.04em;
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }

  .digital-date {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .offset {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  .day-night-indicator {
    position: absolute;
    bottom: 12px;
    right: 14px;
    font-size: 0.85rem;
    opacity: 0.6;
  }

  footer {
    text-align: center;
    margin-top: 48px;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<header>
  <h1>World Clock</h1>
  <div class="local-time" id="local-time">--:--:--</div>
  <div class="local-date" id="local-date">---- / -- / --</div>
</header>

<div class="grid" id="grid"></div>

<footer>Powered by Intl.DateTimeFormat &nbsp;·&nbsp; Updates every frame</footer>

<script>
const CITIES = [
  { city: 'Tokyo',       country: 'Japan',         tz: 'Asia/Tokyo' },
  { city: 'New York',    country: 'USA',            tz: 'America/New_York' },
  { city: 'London',      country: 'United Kingdom', tz: 'Europe/London' },
  { city: 'Paris',       country: 'France',         tz: 'Europe/Paris' },
  { city: 'Dubai',       country: 'UAE',            tz: 'Asia/Dubai' },
  { city: 'Singapore',   country: 'Singapore',      tz: 'Asia/Singapore' },
  { city: 'Sydney',      country: 'Australia',      tz: 'Australia/Sydney' },
  { city: 'Los Angeles', country: 'USA',            tz: 'America/Los_Angeles' },
  { city: 'São Paulo',   country: 'Brazil',         tz: 'America/Sao_Paulo' },
  { city: 'Mumbai',      country: 'India',          tz: 'Asia/Kolkata' },
];

const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;

function getOffsetLabel(tz) {
  const now = new Date();
  const local = new Date(now.toLocaleString('en-US', { timeZone: localTz }));
  const remote = new Date(now.toLocaleString('en-US', { timeZone: tz }));
  const diffH = (remote - local) / 3600000;
  if (diffH === 0) return 'Local';
  return (diffH > 0 ? '+' : '') + (Number.isInteger(diffH) ? diffH : diffH.toFixed(1)) + 'h';
}

function buildAnalogSVG(id) {
  const ticks = [];
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * 360;
    ticks.push(`<line class="tick" x1="32" y1="5" x2="32" y2="9" transform="rotate(${angle} 32 32)"/>`);
  }
  return `<svg viewBox="0 0 64 64">
    <circle class="clock-face" cx="32" cy="32" r="29"/>
    ${ticks.join('')}
    <line class="hand-hour"   id="h-${id}" x1="32" y1="32" x2="32" y2="16"/>
    <line class="hand-minute" id="m-${id}" x1="32" y1="32" x2="32" y2="10"/>
    <line class="hand-second" id="s-${id}" x1="32" y1="38" x2="32" y2="8"/>
    <circle class="center-dot" cx="32" cy="32" r="2.5"/>
  </svg>`;
}

function buildCard(data, index) {
  const id = `city-${index}`;
  const card = document.createElement('div');
  card.className = 'card';
  card.id = `card-${id}`;
  card.innerHTML = `
    <div class="analog">${buildAnalogSVG(id)}</div>
    <div class="info">
      <div class="city-name">${data.city}</div>
      <div class="country">${data.country}</div>
      <div class="digital-time" id="d-${id}">--:--:--</div>
      <div class="digital-date" id="dt-${id}">----/--/--</div>
    </div>
    <div class="offset" id="off-${id}">${getOffsetLabel(data.tz)}</div>
    <div class="day-night-indicator" id="dn-${id}"></div>
  `;
  return card;
}

const grid = document.getElementById('grid');
CITIES.forEach((c, i) => grid.appendChild(buildCard(c, i)));

const fmtTime = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const fmtDate = new Intl.DateTimeFormat('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });

function pad2(n) { return String(n).padStart(2, '0'); }

function tick() {
  const now = new Date();

  // Local header
  const lh = now.getHours(), lm = now.getMinutes(), ls = now.getSeconds();
  document.getElementById('local-time').textContent =
    `${pad2(lh)}:${pad2(lm)}:${pad2(ls)}`;
  document.getElementById('local-date').textContent =
    fmtDate.format(now).replace(/\//g, ' / ');

  CITIES.forEach((data, i) => {
    const id = `city-${i}`;

    // Get time parts in target tz
    const parts = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone: data.tz,
      hour: 'numeric', minute: 'numeric', second: 'numeric',
      hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(now).forEach(p => { parts[p.type] = p.value; });

    const h = parseInt(parts.hour) % 24;
    const m = parseInt(parts.minute);
    const s = parseInt(parts.second);

    // Digital
    document.getElementById(`d-${id}`).textContent =
      `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
    document.getElementById(`dt-${id}`).textContent =
      `${parts.year}/${parts.month}/${parts.day}`;

    // Analog hand angles
    const secDeg   = s * 6;
    const minDeg   = m * 6 + s * 0.1;
    const hourDeg  = (h % 12) * 30 + m * 0.5;

    document.getElementById(`h-${id}`).style.transform = `rotate(${hourDeg}deg)`;
    document.getElementById(`m-${id}`).style.transform = `rotate(${minDeg}deg)`;
    document.getElementById(`s-${id}`).style.transform = `rotate(${secDeg}deg)`;

    // Day / Night
    const isDay = h >= 6 && h < 18;
    const card = document.getElementById(`card-${id}`);
    card.classList.toggle('day',   isDay);
    card.classList.toggle('night', !isDay);
    document.getElementById(`dn-${id}`).textContent = isDay ? '☀️' : '🌙';
  });

  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
</body>
</html>
