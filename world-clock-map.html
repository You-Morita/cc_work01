<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Clock Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #060912;
    color: #e0e0f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 0.85rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #555577;
    font-weight: 400;
  }

  header .utc {
    margin-top: 8px;
    font-size: 0.8rem;
    color: #444466;
    letter-spacing: 0.15em;
  }

  .map-wrap {
    position: relative;
    width: 100%;
    max-width: 1100px;
    border: 1px solid #1a1a2e;
    border-radius: 12px;
    overflow: hidden;
    background: #07101e;
    box-shadow: 0 0 80px rgba(80,60,200,0.08);
  }

  .map-wrap svg.world-map {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Graticule */
  .graticule {
    stroke: #0f1a2e;
    stroke-width: 0.4;
    fill: none;
  }

  /* Ocean */
  .ocean {
    fill: #07101e;
  }

  /* Continents */
  .land {
    fill: #0e1f35;
    stroke: #1a3050;
    stroke-width: 0.6;
  }

  /* Night overlay */
  #night-overlay {
    fill: rgba(0,0,20,0.55);
    pointer-events: none;
  }

  /* City pins */
  .city-group {
    cursor: pointer;
  }

  .city-group:hover .city-card {
    opacity: 1;
    transform: translateY(-4px);
  }

  .city-dot-outer {
    fill: none;
    stroke-width: 1.2;
    opacity: 0;
    animation: ping 2.5s ease-out infinite;
  }

  .city-dot-mid {
    fill: none;
    stroke-width: 0.8;
    opacity: 0;
    animation: ping 2.5s ease-out 0.6s infinite;
  }

  @keyframes ping {
    0%   { r: 3; opacity: 0.6; }
    100% { r: 10; opacity: 0; }
  }

  .city-dot {
    r: 3;
  }

  /* City card */
  .city-card {
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    transform: translateY(0px);
  }

  .card-bg {
    fill: #0d1527;
    stroke: #2a3a5e;
    stroke-width: 0.8;
    rx: 6;
    ry: 6;
  }

  .card-city-name {
    font-size: 7px;
    font-weight: 600;
    fill: #c0c8e8;
    letter-spacing: 0.05em;
  }

  .card-time {
    font-size: 11px;
    font-weight: 200;
    fill: #e8eeff;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.03em;
  }

  .card-date {
    font-size: 5.5px;
    fill: #4a5580;
    font-variant-numeric: tabular-nums;
  }

  .card-flag {
    font-size: 9px;
  }

  /* Always-show label for smaller pins */
  .pin-label {
    font-size: 5.5px;
    fill: #7080a0;
    letter-spacing: 0.04em;
    pointer-events: none;
    user-select: none;
  }

  /* Bottom bar */
  .city-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 1100px;
    margin-top: 16px;
    width: 100%;
  }

  .bar-item {
    flex: 1;
    min-width: 140px;
    background: #0c1120;
    border: 1px solid #1a2238;
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.3s;
  }

  .bar-item.is-day  { border-color: #1e3020; }
  .bar-item.is-night { border-color: #1a1a30; }

  .bar-flag { font-size: 1.1rem; line-height: 1; }

  .bar-info { flex: 1; min-width: 0; }

  .bar-city {
    font-size: 0.75rem;
    font-weight: 600;
    color: #aab0cc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bar-time {
    font-size: 1rem;
    font-weight: 200;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    color: #dde0f5;
    margin-top: 1px;
  }

  .bar-offset {
    font-size: 0.65rem;
    color: #3a4060;
    letter-spacing: 0.06em;
  }

  .bar-dn { font-size: 0.8rem; }
</style>

<script>
const CITIES = [
  { city: 'Tokyo',       country: 'Japan',    flag: '🇯🇵', tz: 'Asia/Tokyo',           lat: 35.68,  lng: 139.69 },
  { city: 'New York',    country: 'USA',      flag: '🇺🇸', tz: 'America/New_York',     lat: 40.71,  lng: -74.01 },
  { city: 'London',      country: 'UK',       flag: '🇬🇧', tz: 'Europe/London',        lat: 51.51,  lng: -0.13  },
  { city: 'Paris',       country: 'France',   flag: '🇫🇷', tz: 'Europe/Paris',         lat: 48.86,  lng: 2.35   },
  { city: 'Dubai',       country: 'UAE',      flag: '🇦🇪', tz: 'Asia/Dubai',           lat: 25.20,  lng: 55.27  },
  { city: 'Singapore',   country: 'Singapore',flag: '🇸🇬', tz: 'Asia/Singapore',       lat: 1.35,   lng: 103.82 },
  { city: 'Sydney',      country: 'Australia',flag: '🇦🇺', tz: 'Australia/Sydney',     lat: -33.87, lng: 151.21 },
  { city: 'Los Angeles', country: 'USA',      flag: '🇺🇸', tz: 'America/Los_Angeles',  lat: 34.05,  lng: -118.24},
  { city: 'São Paulo',   country: 'Brazil',   flag: '🇧🇷', tz: 'America/Sao_Paulo',    lat: -23.55, lng: -46.63 },
  { city: 'Mumbai',      country: 'India',    flag: '🇮🇳', tz: 'Asia/Kolkata',         lat: 19.08,  lng: 72.88  },
];

const W = 1000, H = 500;

function lngLatToXY(lng, lat) {
  return {
    x: (lng + 180) / 360 * W,
    y: (90 - lat) / 180 * H
  };
}

function pad2(n) { return String(Math.floor(n)).padStart(2, '0'); }

// Card offset: pick direction so card stays on screen
function cardOffset(x, y) {
  const dx = x > W * 0.65 ? -85 : 8;
  const dy = y > H * 0.65 ? -72 : -68;
  return { dx, dy };
}

// Build pins
const pinsLayer = document.getElementById('pins-layer');

CITIES.forEach((c, i) => {
  const { x, y } = lngLatToXY(c.lng, c.lat);
  const { dx, dy } = cardOffset(x, y);
  const id = `city-${i}`;
  const color = '#7c6af7';

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'city-group');
  g.setAttribute('id', `pin-${id}`);

  g.innerHTML = `
    <circle class="city-dot-outer" cx="${x}" cy="${y}" r="3" stroke="${color}" style="animation-delay:${i*0.25}s"/>
    <circle class="city-dot-mid"   cx="${x}" cy="${y}" r="3" stroke="${color}" style="animation-delay:${i*0.25+0.3}s"/>
    <circle class="city-dot" cx="${x}" cy="${y}" fill="${color}"/>
    <text class="pin-label" x="${x+5}" y="${y+2}">${c.city}</text>
    <g class="city-card" id="card-${id}" transform="translate(${x+dx},${y+dy})">
      <rect class="card-bg" width="80" height="58"/>
      <text class="card-flag" x="8" y="16">${c.flag}</text>
      <text class="card-city-name" x="26" y="12">${c.city}</text>
      <text class="card-date" x="26" y="20" id="cdate-${id}">----/--/--</text>
      <text class="card-time" x="8" y="40" id="ctime-${id}">--:--:--</text>
      <text class="card-date" x="8" y="52" id="cdesc-${id}" fill="#556080"></text>
    </g>
  `;

  pinsLayer.appendChild(g);
});

// Build bottom bar
const bar = document.getElementById('city-bar');
CITIES.forEach((c, i) => {
  const div = document.createElement('div');
  div.className = 'bar-item';
  div.id = `bar-${i}`;
  div.innerHTML = `
    <div class="bar-flag">${c.flag}</div>
    <div class="bar-info">
      <div class="bar-city">${c.city}</div>
      <div class="bar-time" id="btime-${i}">--:--:--</div>
    </div>
    <div>
      <div class="bar-offset" id="boff-${i}"></div>
      <div class="bar-dn" id="bdn-${i}"></div>
    </div>
  `;
  bar.appendChild(div);
});

// Compute local offset label
const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
function getOffset(tz) {
  const now = new Date();
  const a = new Date(now.toLocaleString('en-US', { timeZone: localTz }));
  const b = new Date(now.toLocaleString('en-US', { timeZone: tz }));
  const d = (b - a) / 3600000;
  if (d === 0) return 'Local';
  return (d > 0 ? '+' : '') + (Number.isInteger(d) ? d : d.toFixed(1)) + 'h';
}

// Night overlay: approximate terminator
// Subsolar latitude (declination): varies ±23.4° over a year
// Subsolar longitude: moves with UTC time
function getSunPosition(date) {
  const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
  const declination = -23.45 * Math.cos((2 * Math.PI / 365) * (dayOfYear + 10));
  const utcHours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
  const solarLng = -((utcHours / 24) * 360 - 180);
  return { lat: declination, lng: solarLng };
}

function buildNightPath(date) {
  const sun = getSunPosition(date);
  const points = [];
  const steps = 360;

  // Generate terminator points (the great circle 90° from subsolar point)
  for (let i = 0; i <= steps; i++) {
    const angle = (i / steps) * 2 * Math.PI;
    // Rotate around subsolar point
    const sunLatR = sun.lat * Math.PI / 180;
    const sunLngR = sun.lng * Math.PI / 180;
    // Point on the terminator circle
    const x3 = Math.cos(sunLatR) * Math.cos(angle);
    const y3 = Math.sin(angle);
    const z3 = Math.sin(sunLatR) * Math.cos(angle);
    // Apply rotation to align with sun longitude
    const xr = x3 * Math.cos(sunLngR) - y3 * Math.sin(sunLngR);
    const yr = x3 * Math.sin(sunLngR) + y3 * Math.cos(sunLngR);
    const lat = Math.asin(Math.max(-1, Math.min(1, z3))) * 180 / Math.PI;
    const lng = Math.atan2(yr, xr) * 180 / Math.PI;
    const px = lngLatToXY(lng, lat);
    points.push(px);
  }

  // Determine which side of the terminator is night
  // The anti-solar point is night center
  const antiSolarLng = sun.lng + 180;
  const antiSolarLat = -sun.lat;
  const antiSolarXY = lngLatToXY(antiSolarLng > 180 ? antiSolarLng - 360 : antiSolarLng, antiSolarLat);

  // Build a polygon: terminator + wrap around the nightside edge
  // Sort terminator points by SVG x for proper polygon winding
  const topOrBottom = antiSolarLat > 0 ? H : 0;

  let path = `M ${points[0].x.toFixed(1)},${points[0].y.toFixed(1)}`;
  for (let i = 1; i < points.length; i++) {
    path += ` L ${points[i].x.toFixed(1)},${points[i].y.toFixed(1)}`;
  }

  // Close by going around the night-side border
  if (antiSolarLat >= 0) {
    // Night center is in northern hemisphere → add top edge
    path += ` L ${W},0 L 0,0 Z`;
  } else {
    path += ` L ${W},${H} L 0,${H} Z`;
  }

  return path;
}

// Weekday names
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function tick() {
  const now = new Date();

  // UTC display
  const uh = now.getUTCHours(), um = now.getUTCMinutes(), us = now.getUTCSeconds();
  document.getElementById('utc-display').textContent =
    `UTC  ${pad2(uh)}:${pad2(um)}:${pad2(us)}`;

  // Night overlay
  document.getElementById('night-overlay').setAttribute('d', buildNightPath(now));

  // Cities
  CITIES.forEach((c, i) => {
    const id = `city-${i}`;
    const parts = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone: c.tz,
      hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short'
    }).formatToParts(now).forEach(p => { parts[p.type] = p.value; });

    const h = parseInt(parts.hour) % 24;
    const m = parseInt(parts.minute);
    const s = parseInt(parts.second);
    const timeStr = `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
    const dateStr = `${parts.year}/${parts.month}/${parts.day}`;
    const isDay = h >= 6 && h < 18;

    // Card
    const ctEl = document.getElementById(`ctime-${id}`);
    const cdEl = document.getElementById(`cdate-${id}`);
    if (ctEl) ctEl.textContent = timeStr;
    if (cdEl) cdEl.textContent = dateStr;

    // Dot color: day=amber, night=indigo
    const dot = document.querySelector(`#pin-${id} .city-dot`);
    const outers = document.querySelectorAll(`#pin-${id} .city-dot-outer, #pin-${id} .city-dot-mid`);
    const col = isDay ? '#f0a030' : '#7c6af7';
    if (dot) dot.setAttribute('fill', col);
    outers.forEach(el => el.setAttribute('stroke', col));

    // Bar
    const bt = document.getElementById(`btime-${i}`);
    const bo = document.getElementById(`boff-${i}`);
    const bd = document.getElementById(`bdn-${i}`);
    const bItem = document.getElementById(`bar-${i}`);
    if (bt) bt.textContent = timeStr;
    if (bo) bo.textContent = getOffset(c.tz);
    if (bd) bd.textContent = isDay ? '☀️' : '🌙';
    if (bItem) {
      bItem.classList.toggle('is-day', isDay);
      bItem.classList.toggle('is-night', !isDay);
    }
  });

  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
